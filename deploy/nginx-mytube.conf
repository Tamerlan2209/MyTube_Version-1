# Шаблон конфига Nginx — обратный прокси для MyTube с доменом.
# Замени ТВОЙ_ДОМЕН.ру на свой домен (и www.ТВОЙ_ДОМЕН.ру при необходимости).
#
# Установка (Ubuntu/Debian):
#   sudo apt install nginx
#   sudo cp deploy/nginx-mytube.conf /etc/nginx/sites-available/mytube
#   sudo ln -s /etc/nginx/sites-available/mytube /etc/nginx/sites-enabled/mytube
#   sudo nginx -t && sudo systemctl reload nginx
#
# Дальше — HTTPS через Let's Encrypt (бесплатно, автопродление):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d ТВОЙ_ДОМЕН.ру -d www.ТВОЙ_ДОМЕН.ру
# certbot сам допишет в этот файл блок для 443/SSL и настроит редирект с http на https.

server {
    listen 80;
    listen [::]:80;
    server_name ТВОЙ_ДОМЕН.ру www.ТВОЙ_ДОМЕН.ру;

    # Видео могут быть большими — подними лимит тела запроса на уровне
    # nginx тоже (это отдельно от MAX_VIDEO_SIZE_MB в server.js)
    client_max_body_size 550M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Заголовки, чтобы сервер знал реальный IP посетителя и протокол —
        # это важно и для rate-limit входа (см. server.js: app.set("trust proxy", 1)),
        # и для корректных https-ссылок в OG-тегах/sitemap
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка Range-запросов (перемотка видео) и долгих загрузок
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
